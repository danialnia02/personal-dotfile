[mgr]
ratio          = [1, 4, 2]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size_and_mtime"
show_hidden    = false
show_symlink   = true

[preview]
tab_size    = 2
max_width   = 600
max_height  = 900

[opener]
edit = [
  { run = 'nvim "%*"', block = true, for = "windows" },
]
extract = [
  { run = '7z x "%*" -o"%*_extracted"', desc = "Extract here (7-Zip)", for = "windows" },
]

[open]
rules = [
  { mime = "text/*",           use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = "extract" },
  { mime = "*",                use = "open" },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false

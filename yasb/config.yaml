# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
komorebi:
  start_command: "komorebic start --whkd && komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd"
bars:
  primary-bar:
    enabled: true
    screens:
    - primary
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 2
      left: 2
      bottom: 2
      right: 2
    widgets:
      left:
      - home
      - komorebi_active_layout
      - komorebi_workspaces
      - taskbar
      center:
      - clock
      - todo
      right:
      - media
      - pomodoro
      - wifi
      - volume
      - battery
      - wallpapers
      - systray
      - power_menu
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
      # - {title: User Home, path: '~'}
      # - {title: Download, path: ~\Downloads}
      # - {title: Documents, path: ~\Documents}
      # - {title: Pictures, path: ~\Pictures}
      - separator: true
      - title: Start Komorebi
        command: komorebic
        args: ["start", "--whkd", "--clean-state"]
        show_window: false
      - title: Stop Komorebi
        command: komorebic
        args: ["stop", "--whkd"]
        show_window: false
      - title: Reload Komorebi
        command: cmd.exe
        args: ["/c", "komorebic stop --whkd && komorebic start --whkd --clean-state"]
        show_window: false
      - separator: true
      - title: Pomodoro 15 min
        command: powershell.exe
        args: ["-NoProfile", "-WindowStyle", "Hidden", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\daani\\dotfiles\\yasb\\set-pomodoro-duration.ps1", "-Minutes", "15"]
        show_window: false
      - title: Pomodoro 30 min
        command: powershell.exe
        args: ["-NoProfile", "-WindowStyle", "Hidden", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\daani\\dotfiles\\yasb\\set-pomodoro-duration.ps1", "-Minutes", "30"]
        show_window: false
      - title: Pomodoro 60 min
        command: powershell.exe
        args: ["-NoProfile", "-WindowStyle", "Hidden", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\daani\\dotfiles\\yasb\\set-pomodoro-duration.ps1", "-Minutes", "60"]
        show_window: false
      - separator: true
      - title: Restart YASB
        command: yasbc
        args: ["reload"]
        show_window: false
      system_menu: false
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "<span>{icon} </span>"
      layouts: ['bsp', 'columns', 'rows', 'grid', 'vertical_stack', 'horizontal_stack', 'ultrawide_vertical_stack','right_main_vertical_stack']
      layout_icons:
        bsp: "\uebeb"
        columns: "\uebf7"
        rows: "\uec01"
        grid: "\udb81\udf58"
        scrolling: "\uebf7"
        vertical_stack: "\uebee"
        horizontal_stack: "\uebf0"
        ultrawide_vertical_stack: "\uebee"
        right_main_vertical_stack: "\uebf1"
        monocle: "\uf06f"
        maximized: "\uf06f"
        floating: "\uf2d2"
        paused: "\udb83\udf89"
        tiling: "\udb81\ude40"
      callbacks:
        on_left: 'toggle_layout_menu'
        on_middle: 'next_layout'
        on_right: 'prev_layout'
      layout_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      hide_if_offline: true
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a %#d %b %#I:%M%p}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  todo:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\uE73A</span> {data[count]}"
      label_alt: "<span>\uE73A</span> {data[count]}"
      class_name: "todo-widget"
      tooltip: true
      tooltip_label: "{data[list]}"
      exec_options:
        run_cmd: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\\Users\\daani\\dotfiles\\yasb\\todo-summary.ps1"
        run_once: false
        run_interval: 60000
        return_format: "json"
      callbacks:
        on_left: "exec powershell.exe -NoProfile -STA -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\\Users\\daani\\dotfiles\\yasb\\today-panel.ps1"
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>{level}
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uE7E8</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  komorebi_control:
    type: komorebi.control.KomorebiControlWidget
    options: {}
  taskbar:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 16
      tooltip: true
  wifi:
    type: yasb.wifi.WifiWidget
    options:
      wifi_icons:
        - "󰤮  "
        - "󰤟  "
        - "󰤢  "
        - "󰤥  "
        - "󰤨  "
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
    # Example path to folder with images. Can be a single string or a list of strings.
    # image_path: "C:\\Users\\{Username}\\Images" 
      image_path: 
        # - "D:\\OneDrive\\Pictures\\Wallpapers\\Themes\\Kanagawa"
        - "C:\\Users\\daani\\Documents\\BackgroundPic"
      change_automatically: true # Automatically change wallpaper
      update_interval: 600 # If change_automatically is true, update interval in seconds
      engine:
        enabled: false # disabled: crashes yasb (AttributeError on '_progress' in WallpaperEngine.paintEvent)
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        enabled: true
        blur: false
        image_width: 220
        image_per_page: 5
        gallery_columns: 0 # 0 = auto, matches image_per_page for a single row
        horizontal_position: "center" # left/center/right placement on screen
        vertical_position: "center" # top/center/bottom placement
        position_offset: 0 # minimum gap (px) from screen edges - see below for advanced options
        respect_work_area: true # clamp to OS work area (avoids Windows taskbar)
        show_buttons: false
        orientation: "portrait"
        image_spacing: 8
        lazy_load: true
        lazy_load_fadein: 400
        image_corner_radius: 8
      callbacks:
        on_left: "toggle_gallery"
        on_middle: "do_nothing"
        on_right: "change_wallpaper"
  battery:
    type: yasb.battery.BatteryWidget
    options:
      status_icons:
        icon_charging: " "
        icon_critical: "  "
        icon_low: "  "
        icon_medium: "  "
        icon_high: "  "
        icon_full: "  "
  systray:
    type: yasb.systray.SystrayWidget
    options:
      icon_size: 16
      show_unpinned: true
      show_unpinned_button: true
      show_in_popup: true
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        direction: down
  pomodoro:
    type: yasb.pomodoro.PomodoroWidget
    options:
      work_duration: 60
      show_notification: true
      auto_start_breaks: false
      auto_start_work: false
      callbacks:
        on_left: toggle_timer
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title}{s}{artist}'
      label_alt: '{title}'
      separator: ' - '
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing
        on_right: do_nothing
      max_field_size:
        label: 20
        label_alt: 20
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 10
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uE892"
        next_track: "\uE893"
        play: "\uE768"
        pause: "\uE769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_volume_slider: true
      scrolling_label:
        enabled: true
        style: bounce
        update_interval_ms: 40
